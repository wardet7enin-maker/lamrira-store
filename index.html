<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الملفات الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#183359">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لَمْريرة">
<style>
  :root{
    --bg:#F3E4C8;
    --surface:#FFFDF8;
    --surface-2:#FBF1DD;
    --line:#E4D3AC;
    --navy:#183359;
    --accent:#CA642C;
    --accent-ink:#FFFDF8;
    --gold:#D7A63D;
    --danger:#D1453A;
    --text:#183359;
    --text-dim:#8a7550;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  /* ===== top bar ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:var(--navy);}
  .brand-logo{width:36px;height:36px;object-fit:contain;flex-shrink:0;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .avatar-btn{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#FFFDF8;font-weight:900;font-size:15px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--text-dim);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}

  /* ===== centered auth card ===== */
  .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-logo{display:block;width:64px;height:64px;object-fit:contain;margin:0 auto 14px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px;width:100%;max-width:400px;}
  .card h2{margin:0 0 6px;font-size:22px;font-weight:900;text-align:center;}
  .card p.sub{margin:0 0 22px;color:var(--text-dim);font-size:14px;text-align:center;}
  label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;margin-top:14px;}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:14px;}
  input:focus{outline:none;border-color:var(--accent);}
  .form-actions{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .switch-link{text-align:center;font-size:13px;color:var(--text-dim);margin-top:16px;}
  .switch-link a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:700;}
  .error-msg{background:rgba(209,69,58,.1);border:1px solid rgba(209,69,58,.35);color:#a12f26;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:14px;}
  .info-msg{background:rgba(215,166,61,.16);border:1px solid rgba(215,166,61,.5);color:#7a5a12;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:14px;}

  /* ===== catalog ===== */
  .page{padding:28px;max-width:1100px;margin:0 auto;width:100%;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:24px;margin:0 0 4px;font-weight:900;}
  .page-head p{color:var(--text-dim);margin:0;font-size:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .product-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s ease;position:relative;}
  .product-card:hover{border-color:var(--accent);}
  .product-thumb{height:110px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:12px;}
  .product-card h3{margin:0 0 6px;font-size:16px;}
  .product-card p{margin:0;color:var(--text-dim);font-size:13px;line-height:1.5;min-height:38px;}
  .badge{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;}
  .badge-locked{background:rgba(209,69,58,.13);color:#a12f26;}
  .badge-unlocked{background:rgba(215,166,61,.2);color:#7a5a12;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .rating-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);margin-top:8px;cursor:pointer;}
  .rating-line span.count{color:var(--text-dim);}
  .star-picker{display:flex;gap:6px;justify-content:center;font-size:28px;margin:14px 0;}
  .star-picker span{cursor:pointer;color:var(--line);}
  .star-picker span.on{color:var(--gold);}
  .review-item{text-align:right;border-bottom:1px solid var(--line);padding:12px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .rstars{color:var(--gold);font-size:13px;}
  .review-item .rname{font-weight:800;font-size:13px;color:var(--navy);}
  .review-item .rtext{font-size:13px;color:var(--text-dim);margin-top:4px;line-height:1.7;}
  .review-empty{text-align:center;color:var(--text-dim);font-size:13px;padding:16px 0;}

  /* ===== modal ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,14,4,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;overflow-y:auto;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;max-width:380px;width:100%;text-align:center;margin:auto;}
  .modal.wide{max-width:480px;text-align:right;}
  .modal .icon{width:52px;height:52px;border-radius:50%;background:rgba(209,69,58,.13);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;}
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{margin:0 0 20px;color:var(--text-dim);font-size:14px;line-height:1.6;}

  /* ===== viewer / protected content ===== */
  .viewer-wrap{position:relative;flex:1;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-moz-user-select:none;}
  .viewer-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);}
  .viewer-body{flex:1;position:relative;padding:36px;overflow:auto;background:
    radial-gradient(circle at 20% 20%, rgba(215,166,61,.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(24,51,89,.05), transparent 40%),
    var(--bg);}
  .content-box{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:34px;position:relative;}
  .content-box h2{margin-top:0;}
  .content-box p{line-height:1.9;color:var(--text-dim);}
  .watermark-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
  .watermark-tile{position:absolute;white-space:nowrap;font-size:13px;font-weight:700;color:rgba(255,255,255,.09);transform:rotate(-28deg);}
  .protection-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);padding:10px 24px;border-top:1px solid var(--line);background:var(--surface);}
  .blur-guard{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim);text-align:center;padding:20px;}

  /* ===== تواصل معنا ===== */
  .site-footer{border-top:1px solid var(--line);padding:22px 24px;text-align:center;background:var(--surface);}
  .site-footer h4{margin:0 0 10px;font-size:14px;color:var(--navy);}
  .site-footer .contacts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;}
  .site-footer a{color:var(--accent);text-decoration:none;font-weight:700;}

  /* ===== admin ===== */
  .tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab{padding:10px 4px;margin-left:20px;font-size:14px;font-weight:700;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--accent);border-color:var(--accent);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:right;color:var(--text-dim);font-size:12px;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);}
  td{padding:12px;border-bottom:1px solid var(--line);}
  tr:hover td{background:rgba(24,51,89,.03);}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
  .panel h3{margin:0 0 16px;font-size:16px;}

  .inline-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .inline-form .full{grid-column:1/-1;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .chip-on{background:rgba(215,166,61,.22);color:#7a5a12;}
  .chip-off{background:rgba(24,51,89,.06);color:var(--text-dim);}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .small-note{font-size:12px;color:var(--text-dim);margin-top:8px;}
  /* ===== تصميم "تبريعة وامردة" — نفس ألوان وتصميم البطاقات الأصلية ===== */
  .tb-screen{--tb-bg:#F3E5C8;--tb-card:#FBF3E1;--tb-orange:#C0652E;--tb-navy:#1E3A5F;--tb-qbox:#E7EEF6;--tb-cbox:#F5E8D5;--tb-gold:#D9A441;
    position:relative;min-height:100%;background:var(--tb-bg);color:var(--tb-navy);overflow:hidden;display:flex;flex-direction:column;}
  .tb-blob{position:absolute;bottom:-10%;left:-10%;width:70%;height:45%;background:radial-gradient(circle at 30% 30%, #D89B6B, #C0652E 70%);border-radius:50%;opacity:.5;filter:blur(2px);pointer-events:none;}
  .tb-blob2{position:absolute;bottom:-18%;right:-15%;width:55%;height:38%;background:radial-gradient(circle at 60% 40%, #E7C089, #C77A3F 70%);border-radius:50%;opacity:.6;pointer-events:none;}
  .tb-inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;}
  .tb-dots{display:flex;gap:6px;justify-content:center;margin:10px 0;}
  .tb-dot{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);}
  .tb-title{font-size:34px;font-weight:900;color:var(--tb-navy);margin:10px 0;}
  .tb-tagline{font-size:16px;font-weight:700;color:var(--tb-orange);margin-bottom:6px;}
  .tb-quote-box{border:2px solid var(--tb-gold);background:var(--tb-card);border-radius:14px;padding:14px 22px;margin:18px 0;font-weight:700;color:var(--tb-navy);max-width:420px;}
  .tb-eyebrow{font-size:13px;color:var(--tb-navy);opacity:.75;font-weight:700;}
  .tb-btn{border:none;border-radius:30px;padding:14px 32px;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;background:var(--tb-orange);color:#fff;margin-top:10px;}
  .tb-btn.navy{background:var(--tb-navy);}
  .tb-credit{position:absolute;bottom:14px;right:20px;left:20px;display:flex;justify-content:space-between;font-size:10px;color:var(--tb-navy);opacity:.55;z-index:2;}
  .tb-intro-box{border:2px solid var(--tb-gold);background:var(--tb-card);border-radius:16px;padding:22px;max-width:520px;text-align:right;line-height:2;font-size:14px;}
  .tb-intro-box .em{color:var(--tb-orange);font-weight:800;}
  .tb-choice-row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

  /* شاشة سحب البطاقات */
  .tb-game{flex:1;display:flex;flex-direction:row;position:relative;z-index:2;}
  .tb-pile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:20px;position:relative;}
  .tb-pile.q{border-left:2px dashed rgba(30,58,95,.25);}
  .tb-stack{position:relative;width:120px;height:150px;}
  .tb-stack .layer{position:absolute;inset:0;border-radius:14px;border:2px solid rgba(255,255,255,.5);}
  .tb-pile.q .layer{background:linear-gradient(135deg,var(--tb-orange),#9c4c20);}
  .tb-pile.c .layer{background:linear-gradient(135deg,var(--tb-navy),#0f2137);}
  .tb-stack .layer:nth-child(1){transform:rotate(-6deg) translateY(4px);}
  .tb-stack .layer:nth-child(2){transform:rotate(4deg) translateY(2px);}
  .tb-stack .layer:nth-child(3){display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;}
  .tb-pile-label{font-weight:900;font-size:17px;}
  .tb-pile.q .tb-pile-label{color:var(--tb-orange);}
  .tb-pile.c .tb-pile-label{color:var(--tb-navy);}
  .tb-pile-hint{font-size:12px;color:var(--tb-navy);opacity:.6;}
  .tb-pile-count{font-size:11px;color:var(--tb-navy);opacity:.5;}

  /* البطاقة المكشوفة */
  .tb-reveal-overlay{position:absolute;inset:0;z-index:5;background:var(--tb-bg);display:flex;align-items:flex-start;justify-content:center;padding:22px;overflow-y:auto;}
  .tb-reveal-overlay .tb-card{margin:auto;}
  .tb-card{position:relative;background:var(--tb-card);border-radius:22px;border-top:4px solid var(--tb-orange);max-width:480px;width:100%;padding:46px 26px 26px;text-align:center;}
  .tb-card.is-c{border-top-color:var(--tb-navy);}
  .tb-badge{position:absolute;top:-34px;right:50%;transform:translateX(50%);width:78px;height:78px;border-radius:50%;background:var(--tb-orange);border:4px solid var(--tb-card);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:19px;}
  .tb-card.is-c .tb-badge{background:var(--tb-navy);}
  .tb-num{position:absolute;top:8px;left:18px;font-weight:900;font-size:20px;color:var(--tb-orange);}
  .tb-card.is-c .tb-num{color:var(--tb-navy);}
  .tb-diamond{position:absolute;top:14px;width:9px;height:9px;background:var(--tb-gold);transform:rotate(45deg);}
  .tb-diamond.right{right:16px;}
  .tb-diamond.left{left:16px;}
  .tb-proverb{background:var(--tb-qbox);border-radius:12px;padding:18px 16px;margin:18px 0 10px;font-weight:700;font-style:italic;color:var(--tb-navy);font-size:17px;line-height:2;font-family:'Noto Naskh Arabic','Tajawal',sans-serif;}
  .tb-card.is-c .tb-proverb{background:var(--tb-cbox);color:var(--tb-orange);}
  .tb-body-text{font-size:15px;line-height:2;color:#3a2f22;margin:14px 4px 6px;font-family:'Noto Naskh Arabic','Tajawal',sans-serif;}
  .tb-pill{display:inline-block;border:none;border-radius:22px;padding:9px 26px;font-weight:900;font-size:13px;color:#fff;background:var(--tb-orange);margin-top:16px;}
  .tb-card.is-c .tb-pill{background:var(--tb-navy);}
  .tb-reveal-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

  /* غرفة اللعب الجماعي عن بعد */
  .tb-room-btn{position:absolute;top:14px;right:14px;z-index:6;border:none;border-radius:20px;padding:9px 16px;background:var(--tb-navy);color:#fff;font-weight:800;font-size:12px;cursor:pointer;}
  .tb-room-panel{position:absolute;inset:0;z-index:7;background:var(--tb-bg);display:flex;align-items:center;justify-content:center;padding:22px;}
  .tb-room-card{background:var(--tb-card);border-radius:20px;padding:30px 24px;max-width:420px;width:100%;text-align:center;border-top:4px solid var(--tb-navy);}
  .tb-room-code{font-size:38px;font-weight:900;letter-spacing:6px;color:var(--tb-navy);background:var(--tb-qbox);border-radius:12px;padding:14px;margin:16px 0;}
  .tb-room-link{font-size:12px;color:#3a2f22;background:var(--tb-cbox);border-radius:10px;padding:10px;word-break:break-all;margin-bottom:16px;}
  .tb-guest-count{font-size:13px;color:var(--tb-orange);font-weight:800;margin-bottom:10px;}
  .tb-guest-wait{font-size:15px;color:var(--tb-navy);opacity:.7;text-align:center;padding:30px 20px;}

  .tb-exit{position:absolute;top:14px;left:14px;z-index:6;width:34px;height:34px;border-radius:50%;border:none;background:rgba(30,58,95,.12);color:var(--tb-navy);font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .tb-exit:hover{background:rgba(30,58,95,.22);}

  .mini-cover{height:110px;border-radius:8px;overflow:hidden;position:relative;background:#F3E5C8;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:12px;}
  .mini-cover .mc-blob{position:absolute;bottom:-20%;left:-10%;width:60%;height:55%;background:radial-gradient(circle at 30% 30%,#D89B6B,#C0652E 70%);border-radius:50%;opacity:.55;}
  .mini-cover .mc-blob2{position:absolute;bottom:-25%;right:-10%;width:45%;height:42%;background:radial-gradient(circle at 60% 40%,#E7C089,#C77A3F 70%);border-radius:50%;opacity:.6;}
  .mini-cover .mc-title{position:relative;z-index:2;font-weight:900;color:#1E3A5F;font-size:16px;}
  .mini-cover .mc-tag{position:relative;z-index:2;color:#C0652E;font-size:10px;font-weight:700;margin-top:3px;}

  @media (max-width:640px){
    .inline-form{grid-template-columns:1fr;}
    .page{padding:18px;}
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px;}
    td{border:none;padding:6px 8px;}
    td::before{content:attr(data-label);display:block;font-size:11px;color:var(--text-dim);margin-bottom:2px;}
  }
</style>
</head>
<body>
<div id="app"></div>

const HEARTBEAT_MS = 15000;
const SESSION_TIMEOUT_MS = 40000;
const MAX_DEVICES = 3;

let current = null;      // {email, username, isAdmin}
let products = [];
let approvedIds = new Set();
let mySessionId = null;
let heartbeatTimer = null;
let view = "loading";
let viewParams = {};
let recoveryMode = false; // true عند العودة من رابط "نسيت كلمة المرور"

/* ============== أدوات مساعدة عامة ============== */
function fmtErr(error){
  if(!error) return "حدث خطأ غير متوقع.";
  const msg = (error.message||"").toLowerCase();
  if(msg.includes("invalid login")) return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  if(msg.includes("already registered") || msg.includes("already exists")) return "هذا البريد الإلكتروني مسجل مسبقًا.";
  if(msg.includes("password") && msg.includes("least")) return "كلمة المرور قصيرة جدًا (6 أحرف على الأقل).";
  if(msg.includes("email not confirmed")) return "لم يتم تأكيد بريدك الإلكتروني بعد. تحققي من صندوق الوارد.";
  return error.message || "حدث خطأ غير متوقع.";
}

/* ============== الجلسات وحد الأجهزة ============== */
async function activeSessionCount(email){
  const cutoff = new Date(Date.now()-SESSION_TIMEOUT_MS).toISOString();
  const { count, error } = await sb.from("device_sessions")
    .select("id", { count: "exact", head: true })
    .eq("user_email", email)
    .gt("last_seen", cutoff);
  if(error){ console.warn(error); return 0; }
  return count||0;
}
// كل الأجهزة المسجّلة تاريخيًا لهذا البريد (بغض النظر عن كونها متصلة الآن أو لا)
async function registeredDeviceIds(email){
  const { data, error } = await sb.from("device_sessions").select("session_id").eq("user_email", email);
  if(error){ console.warn(error); return []; }
  return [...new Set((data||[]).map(r=>r.session_id))];
}
async function startHeartbeat(email){
  // نستخدم localStorage لتثبيت هوية هذا الجهاز/المتصفح، حتى لا يُحتسب
  // تحديث الصفحة كجهاز جديد في كل مرة.
  const storageKey = "lamrira_device_" + email;
  let existingId = localStorage.getItem(storageKey);
  if(existingId){
    mySessionId = existingId;
    const { data } = await sb.from("device_sessions")
      .update({ last_seen: new Date().toISOString() })
      .eq("session_id", mySessionId)
      .select();
    if(!data || data.length===0){
      await sb.from("device_sessions").insert({ user_email: email, session_id: mySessionId, last_seen: new Date().toISOString() });
    }
  } else {
    mySessionId = crypto.randomUUID();
    localStorage.setItem(storageKey, mySessionId);
    await sb.from("device_sessions").insert({ user_email: email, session_id: mySessionId, last_seen: new Date().toISOString() });
  }
  heartbeatTimer = setInterval(async ()=>{
    await sb.from("device_sessions").update({ last_seen: new Date().toISOString() }).eq("session_id", mySessionId);
  }, HEARTBEAT_MS);
}
function stopHeartbeat(){
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = null;
}
async function endMySession(){
  if(mySessionId){ await sb.from("device_sessions").delete().eq("session_id", mySessionId); }
  if(current){ localStorage.removeItem("lamrira_device_" + current.email); }
  stopHeartbeat();
  mySessionId = null;
}

/* ============== تحميل البيانات ============== */
async function loadProducts(){
  const { data, error } = await sb.from("products").select("*").order("created_at", {ascending:true});
  products = error ? [] : (data||[]);
}
async function loadMyApprovals(email){
  const { data, error } = await sb.from("approvals").select("product_id").eq("user_email", email);
  approvedIds = new Set(error ? [] : (data||[]).map(r=>r.product_id));
}
function isApproved(productId){
  return approvedIds.has(productId);
}
let reviewsAll = [];
async function loadReviewsSummary(){
  const { data, error } = await sb.from("reviews").select("product_id, rating");
  reviewsAll = error ? [] : (data||[]);
}
function ratingSummary(productId){
  const rs = reviewsAll.filter(r=>r.product_id===productId);
  if(rs.length===0) return { avg:0, count:0 };
  const avg = rs.reduce((a,r)=>a+r.rating,0)/rs.length;
  return { avg, count: rs.length };
}
async function openReviewsModal(product, canReview){
  const overlay = el("div",{class:"modal-overlay"});
  const modal = el("div",{class:"modal wide"});
  modal.append(el("h3",{style:"text-align:center;"}, "تقييمات: "+product.title));
  const listWrap = el("div",{}, el("p",{class:"review-empty"},"جارِ التحميل..."));
  modal.append(listWrap);

  if(canReview){
    modal.append(el("h3",{style:"margin-top:20px;font-size:14px;"},"أضيفي تقييمك"));
    let myRating = 0;
    const picker = el("div",{class:"star-picker"});
    const stars = [1,2,3,4,5].map(n=>{
      const s = el("span",{}, "★");
      s.addEventListener("click", ()=>{ myRating = n; stars.forEach((st,i)=> st.classList.toggle("on", i<n)); });
      picker.append(s);
      return s;
    });
    modal.append(picker);

    submitBtn.addEventListener("click", async ()=>{
      errBox.innerHTML="";
      if(myRating===0){ errBox.append(el("div",{class:"error-msg"},"اختاري عدد النجوم أولًا.")); return; }
      submitBtn.disabled=true; submitBtn.textContent="جارِ الإرسال...";
      const { error } = await sb.from("reviews").upsert({
        product_id: product.id, user_email: current.email, username: current.username,
        rating: myRating, comment: comment.value.trim()
      }, { onConflict: "product_id,user_email" });
      submitBtn.disabled=false; submitBtn.textContent="إرسال التقييم";
      if(error){ errBox.append(el("div",{class:"error-msg"}, error.message)); return; }
      await loadReviewsSummary();
      overlay.remove();
      render();
    });
    modal.append(submitBtn);
  }

  const closeBtn = el("button",{class:"btn btn-ghost",style:"width:100%;margin-top:14px;"},"إغلاق");
  closeBtn.addEventListener("click", ()=>overlay.remove());
  modal.append(closeBtn);
  overlay.append(modal);
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) overlay.remove(); });
  document.body.append(overlay);

  const { data } = await sb.from("reviews").select("*").eq("product_id", product.id).order("created_at",{ascending:false});
  listWrap.innerHTML = "";
  if(!data || data.length===0){
    listWrap.append(el("p",{class:"review-empty"},"لا توجد تقييمات بعد — كوني أول من يشارك رأيها."));
  } else {
    data.forEach(r=>{
      const item = el("div",{class:"review-item"});
      item.append(el("div",{class:"rstars"}, "★".repeat(r.rating)+"☆".repeat(5-r.rating)));
      item.append(el("div",{class:"rname"}, r.username||r.user_email));
      if(r.comment) item.append(el("div",{class:"rtext"}, r.comment));
      listWrap.append(item);
    });
  }
}

/* ============== المصادقة ============== */
async function establishSession(session){
  const email = session.user.email;
  const username = (session.user.user_metadata && session.user.user_metadata.username) || email.split("@")[0];
  current = { email, username, isAdmin: email.toLowerCase()===ADMIN_EMAIL };
  await loadProducts();
  await loadMyApprovals(email);
  await loadReviewsSummary();
  await startHeartbeat(email);
}
async function logout(){
  await endMySession();
  tebraaState = null;
  await sb.auth.signOut();
  current = null;
  view = "login";
  render();
}

/* ============== الأدوات المساعدة للواجهة ============== */
function render(){

function renderLogin(){
  const wrap = el("div",{class:"center-wrap"});
  const card = el("div",{class:"card"});
  card.append(el("img",{class:"auth-logo",src:LOGO_DATA_URI,alt:"لَمْريرة"}));
  card.append(el("h2",{},"تسجيل الدخول"));
  card.append(el("p",{class:"sub"},"ادخل إلى حسابك لعرض المنتجات المسموح لك بالوصول إليها."));
  const email = el("input",{type:"email",placeholder:"you@example.com"});
  const pass = el("input",{type:"password",placeholder:"••••••••"});
  const errBox = el("div",{});
  card.append(el("label",{},"البريد الإلكتروني"), email);
  card.append(el("label",{},"كلمة المرور"), pass);
  card.append(errBox);
  const actions = el("div",{class:"form-actions"});
  const submitBtn = el("button",{class:"btn btn-primary"},"دخول");
  submitBtn.addEventListener("click", async ()=>{
    errBox.innerHTML="";
    const emailVal = email.value.trim().toLowerCase();
    const passVal = pass.value;
    if(!emailVal || !passVal){ errBox.append(el("div",{class:"error-msg"},"الرجاء إدخال البريد الإلكتروني وكلمة المرور.")); return; }
    submitBtn.disabled=true; submitBtn.textContent="جارِ التحقق...";
    const { data, error } = await sb.auth.signInWithPassword({ email: emailVal, password: passVal });
    if(error){
      submitBtn.disabled=false; submitBtn.textContent="دخول";
      errBox.append(el("div",{class:"error-msg"}, fmtErr(error)));
      return;
    }
    const myDeviceKey = "lamrira_device_" + emailVal;
    const myDeviceId = localStorage.getItem(myDeviceKey);
    const knownDevices = await registeredDeviceIds(emailVal);
    const isKnownDevice = myDeviceId && knownDevices.includes(myDeviceId);
    if(!isKnownDevice && knownDevices.length >= MAX_DEVICES){
      await sb.auth.signOut();
      submitBtn.disabled=false; submitBtn.textContent="دخول";
      errBox.append(el("div",{class:"error-msg"}, `هذا البريد مسجَّل بالفعل من ${MAX_DEVICES} أجهزة مختلفة (الحد الأقصى). تواصلي مع صفحة لَمْريرة لإعادة ضبط الأجهزة.`));
      return;
    }
    await establishSession(data.session);
    view = current.isAdmin ? "admin" : "catalog";
    render();
  });
  actions.append(submitBtn);
  card.append(actions);
  const forgot = el("div",{class:"switch-link"}, el("a",{onclick: async ()=>{
    const val = email.value.trim();
    if(!val){ errBox.innerHTML=""; errBox.append(el("div",{class:"error-msg"},"اكتبي بريدك الإلكتروني أولًا في الحقل أعلاه.")); return; }
    const { error } = await sb.auth.resetPasswordForEmail(val, { redirectTo: window.location.origin + window.location.pathname });
    errBox.innerHTML="";
    if(error) errBox.append(el("div",{class:"error-msg"}, fmtErr(error)));
    else errBox.append(el("div",{class:"info-msg"},"أرسلنا رابط إعادة تعيين كلمة المرور إلى بريدك، تحققي من صندوق الوارد."));
  }},"نسيت كلمة المرور؟"));
  card.append(forgot);
  card.append(el("div",{class:"switch-link"}, "ليس لديك حساب؟ ", el("a",{onclick:()=>{view="register";render();}},"إنشاء حساب جديد")));

  return wrap;
}

  wrap.append(page);
  return wrap;
}
async function refreshAdminTabData(){
  if(adminTab==="access"){
    const { data } = await sb.from("approvals").select("*").order("created_at",{ascending:false});
    allApprovals = data||[];
  }
  if(adminTab==="sessions"){
    const { data } = await sb.from("device_sessions").select("*");
    allSessions = data||[];
  }
}

function renderAdminAccess(){
  const box = el("div",{});
  const grantPanel = el("div",{class:"panel"});
  grantPanel.append(el("h3",{},"منح صلاحية وصول جديدة"));
  const form = el("div",{class:"inline-form"});
  const emailInput = el("input",{class:"full",type:"email",placeholder:"بريد العميلة الإلكتروني"});
  form.append(el("div",{class:"full"},el("label",{},"بريد العميلة"), emailInput));
  grantPanel.append(form);
  const chipsWrap = el("div",{class:"row-actions",style:"margin-top:14px;"});
  const errBox = el("div",{});
  products.forEach(p=>{
    const chip = el("span",{class:"chip chip-off",style:"cursor:pointer;"}, p.title);
    chip.addEventListener("click", async ()=>{
      errBox.innerHTML="";
      const em = emailInput.value.trim().toLowerCase();
      if(!em){ errBox.append(el("div",{class:"error-msg"},"اكتبي بريد العميلة أولًا.")); return; }
      const { error } = await sb.from("approvals").insert({ user_email: em, product_id: p.id });
      if(error && !error.message.includes("duplicate")){ errBox.append(el("div",{class:"error-msg"}, fmtErr(error))); return; }
      await refreshAdminTabData();
      render();
    });
    chipsWrap.append(chip);
  });
  grantPanel.append(chipsWrap, errBox);
  box.append(grantPanel);

  const listPanel = el("div",{class:"panel"});
  listPanel.append(el("h3",{},`الصلاحيات الممنوحة حاليًا (${allApprovals.length})`));
  if(allApprovals.length===0){
    listPanel.append(el("p",{class:"small-note"},"لا توجد صلاحيات ممنوحة بعد."));
  } else {
    const table = el("table");
    table.append(el("thead",{},el("tr",{}, el("th",{},"البريد الإلكتروني"), el("th",{},"المنتج"), el("th",{},"إجراءات"))));
    const tbody = el("tbody");
    allApprovals.forEach(a=>{
      const prod = products.find(p=>p.id===a.product_id);
      const tr = el("tr",{});
      tr.append(el("td",{"data-label":"البريد"}, a.user_email));
      tr.append(el("td",{"data-label":"المنتج"}, prod?prod.title:"(محذوف)"));
      const actions = el("td",{"data-label":"إجراءات"});
      const revoke = el("button",{class:"btn btn-danger btn-sm"},"سحب الصلاحية");
      revoke.addEventListener("click", async ()=>{
        revoke.disabled=true;
        await sb.from("approvals").delete().eq("id", a.id);
        await refreshAdminTabData();
        render();
      });
      actions.append(revoke);
      tr.append(actions);
      tbody.append(tr);
    });
    table.append(tbody);
    listPanel.append(table);
  }
  box.append(listPanel);
  return box;
}

function renderAdminSessions(){
  const box = el("div",{});
  const panel = el("div",{class:"panel"});
  panel.append(el("h3",{},`الأجهزة المسجّلة (الحد الأقصى ${MAX_DEVICES} لكل مستخدمة)`));
  const cutoff = Date.now()-SESSION_TIMEOUT_MS;
  const byEmail = {};
  allSessions.forEach(s=>{
    if(!byEmail[s.user_email]) byEmail[s.user_email] = { ids:new Set(), active:0 };
    byEmail[s.user_email].ids.add(s.session_id);
    if(new Date(s.last_seen).getTime() >= cutoff) byEmail[s.user_email].active++;
  });
  const emails = Object.keys(byEmail);
  if(emails.length===0){
    panel.append(el("p",{class:"small-note"},"لا توجد أجهزة مسجّلة حاليًا."));
  } else {
    const table = el("table");
    table.append(el("thead",{},el("tr",{}, el("th",{},"البريد الإلكتروني"), el("th",{},"الأجهزة المسجّلة"), el("th",{},"إجراءات"))));
    const tbody = el("tbody");
    emails.forEach(email=>{
      const info = byEmail[email];
      const tr = el("tr",{});
      tr.append(el("td",{"data-label":"البريد"},email));
      tr.append(el("td",{"data-label":"العدد"}, `${info.ids.size} / ${MAX_DEVICES} مسجّلة (${info.active} نشط الآن)`));
      const actions = el("td",{"data-label":"إجراءات"});
      const clearBtn = el("button",{class:"btn btn-ghost btn-sm"},"إعادة ضبط كل أجهزتها");
      clearBtn.addEventListener("click", async ()=>{
        clearBtn.disabled=true;
        await sb.from("device_sessions").delete().eq("user_email", email);
        await refreshAdminTabData();
        render();
      });
      actions.append(clearBtn);
      tr.append(actions);
      tbody.append(tr);
    });
    table.append(tbody);
    panel.append(table);
  }
  box.append(panel);
  return box;
}

sb.auth.onAuthStateChange((event, session)=>{
  if(event === "PASSWORD_RECOVERY"){
    recoveryMode = true;
    view = "reset-password";
    render();
  }
});

(async function init(){
  try{
    if(window.location.hash.includes("type=recovery")){
      // سنعالجها عبر onAuthStateChange أعلاه
      return;
    }
    const roomParam = new URLSearchParams(window.location.search).get("room");
    if(roomParam){
      view = "guest-name"; viewParams = { room: roomParam.toUpperCase() };
      render();
      return;
    }
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      await establishSession(session);
      view = current.isAdmin ? "admin" : "catalog";
    } else {
      view = "login";
    }
    render();
  }catch(err){
    document.getElementById("app").innerHTML =
      '<div style="padding:40px;text-align:center;color:#F2EFE7;font-family:Tajawal,sans-serif;">'
      + '<h2>حدث خطأ أثناء تحميل الصفحة</h2>'
      + '<p style="color:#93A0BF;">' + (err && err.message ? err.message : String(err)) + '</p>'
      + '</div>';
    console.error(err);
  }
})();

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{ if(c!=null) e.append(c instanceof Node ? c : document.createTextNode(c)); });
  return e;
}

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
let tebraaState = null;
function initTebraaState(){
  tebraaState = {
    screen: "cover", // cover | intro | game
    qQueue: shuffledIndices(TEBRAA_QUESTIONS.length), qPos: 0,
    cQueue: shuffledIndices(TEBRAA_CHALLENGES.length), cPos: 0,
    revealed: null, // {type:'q'|'c', card}
    room: null, showRoomPanel: false,
  };
}
function tebraaNextCard(type){
  const isQ = type==="q";
  const list = isQ ? TEBRAA_QUESTIONS : TEBRAA_CHALLENGES;
  let queueKey = isQ ? "qQueue" : "cQueue", posKey = isQ ? "qPos" : "cPos";
  if(tebraaState[posKey] >= tebraaState[queueKey].length){
    tebraaState[queueKey] = shuffledIndices(list.length);
    tebraaState[posKey] = 0;
  }
  const idx = tebraaState[queueKey][tebraaState[posKey]];
  tebraaState[posKey]++;
  return list[idx];
}
function renderTebraaGame(){
  if(!tebraaState) initTebraaState();
  if(tebraaState.screen==="cover") return tebraaCoverScreen();
  if(tebraaState.screen==="intro") return tebraaIntroScreen();
  return tebraaGameScreen();
}

function tebraaRoomPanel(){
  const overlay = el("div",{class:"tb-room-panel"});
  const card = el("div",{class:"tb-room-card"});
  if(!tebraaState.room){
    card.append(el("h3",{},"لعب جماعي عن بعد"));
    card.append(el("p",{style:"color:#6b5a3a;font-size:13px;line-height:1.8;"},"افتحي غرفة، وشاركي رابطها مع صديقاتك؛ يدخلن مباشرة دون حساب، ويشاهدن كل بطاقة تسحبينها لحظة بلحظة."));
    const createBtn = el("button",{class:"tb-btn navy",style:"width:100%;margin-top:10px;"},"إنشاء غرفة جديدة");
    createBtn.addEventListener("click", ()=>{ createRoom(); render(); });
    card.append(createBtn);
  } else {
    card.append(el("h3",{},"الغرفة مفتوحة ✅"));
    card.append(el("div",{class:"tb-room-code"}, tebraaState.room.code));
    const link = window.location.origin + window.location.pathname + "?room=" + tebraaState.room.code;
    const linkBox = el("div",{class:"tb-room-link"}, link);
    card.append(linkBox);
    const copyBtn = el("button",{class:"tb-btn",style:"width:100%;"},"نسخ رابط الدعوة");
    copyBtn.addEventListener("click", ()=>{
      navigator.clipboard && navigator.clipboard.writeText(link);
      copyBtn.textContent = "تم النسخ ✅";
      setTimeout(()=>{ copyBtn.textContent="نسخ رابط الدعوة"; }, 1500);
    });
    card.append(copyBtn);
    card.append(el("div",{class:"tb-guest-count"}, `👥 ${tebraaState.room.guestCount||0} انضمّوا الآن`));
    const closeRoomBtn = el("button",{class:"btn btn-danger btn-sm",style:"margin-top:6px;"},"إغلاق الغرفة");
    closeRoomBtn.addEventListener("click", ()=>{ leaveRoom(); render(); });
    card.append(closeRoomBtn);
  }
  const closeBtn = el("button",{class:"btn btn-ghost btn-sm",style:"margin-top:16px;"},"إغلاق هذه النافذة");
  closeBtn.addEventListener("click", ()=>{ tebraaState.showRoomPanel=false; render(); });
  card.append(closeBtn);
  overlay.append(card);
  return overlay;
}
function makeRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function createRoom(){
  const code = makeRoomCode();
  const channel = sb.channel("room-"+code, { config: { broadcast: { self: false } } });
  channel.on("broadcast", { event: "guest-hello" }, ()=>{
    tebraaState.room.guestCount = (tebraaState.room.guestCount||0) + 1;
    render();
  }).subscribe();
  tebraaState.room = { code, channel, guestCount: 0 };
}
function leaveRoom(){
  if(tebraaState.room && tebraaState.room.channel){
    sb.removeChannel(tebraaState.room.channel);
  }
  tebraaState.room = null;
  tebraaState.showRoomPanel = false;
}
function broadcastCard(){
  if(!tebraaState.room) return;
  const {type, card} = tebraaState.revealed;
  tebraaState.room.channel.send({ type:"broadcast", event:"card", payload:{ type, card } });
}
function broadcastReset(){
  if(!tebraaState.room) return;
  tebraaState.room.channel.send({ type:"broadcast", event:"reset", payload:{} });
}

function tebraaRevealOverlay(){
  const {type, card} = tebraaState.revealed;
  const isQ = type==="q";
  const overlay = el("div",{class:"tb-reveal-overlay"});
  const cardEl = el("div",{class:"tb-card"+(isQ?"":" is-c")});
  cardEl.append(el("div",{class:"tb-badge"}, isQ?"سؤال":"تحدّي"));
  cardEl.append(el("div",{class:"tb-diamond right"}), el("div",{class:"tb-diamond left"}));
  cardEl.append(el("div",{class:"tb-proverb"}, '"'+card.proverb+'"'));
  cardEl.append(el("div",{class:"tb-body-text"}, card.text));
  cardEl.append(el("div",{},el("span",{class:"tb-pill"}, isQ?"السؤال":"التحدّي")));
  const actions = el("div",{class:"tb-reveal-actions"});
  const backBtn = el("button",{class:"tb-btn"+(isQ?"":" navy")}, "رجوع للكومتين");
  backBtn.addEventListener("click", ()=>{ tebraaState.revealed=null; broadcastReset(); render(); });
  actions.append(backBtn);
  cardEl.append(actions);
  overlay.append(cardEl);
  return overlay;
}

  inner.append(el("div",{class:"tb-eyebrow"},"دعوة للعب — تبريعة وامردة"));
  inner.append(el("h1",{class:"tb-title",style:"font-size:26px;"},"انضمي للجلسة"));
  const input = el("input",{type:"text",placeholder:"اكتبي اسمك",style:"max-width:280px;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--tb-gold);background:var(--tb-card);font-family:'Tajawal',sans-serif;font-size:15px;text-align:center;margin-top:16px;"});
  const errBox = el("div",{});
  const joinBtn = el("button",{class:"tb-btn",style:"margin-top:14px;"},"دخول للجلسة");
  joinBtn.addEventListener("click", ()=>{
    errBox.innerHTML="";
    if(!input.value.trim()){ errBox.append(el("div",{class:"error-msg"},"اكتبي اسمك أولًا.")); return; }
    guestState.name = input.value.trim();
    joinGuestRoom(viewParams.room);
    view = "guest-watch";
    render();
  });
  inner.append(input, errBox, joinBtn);
  wrap.append(inner);
  return wrap;
}
function joinGuestRoom(code){
  const channel = sb.channel("room-"+code, { config: { broadcast: { self:false } } });
  channel.on("broadcast", { event:"card" }, (msg)=>{
    guestState.revealed = msg.payload; guestState.waiting=false; render();
  }).on("broadcast", { event:"reset" }, ()=>{
    guestState.revealed = null; guestState.waiting=true; render();
  }).subscribe((status)=>{
    if(status === "SUBSCRIBED"){
      channel.send({ type:"broadcast", event:"guest-hello", payload:{ name: guestState.name } });
    }
  });
  guestState.channel = channel;
}
function renderGuestWatch(){
  const wrap = el("div",{class:"tb-screen",style:"min-height:100vh;"});
  const bar = el("div",{style:"padding:14px 20px;font-weight:800;color:var(--tb-navy);opacity:.7;font-size:13px;"}, `👋 ${guestState.name} — متابعة مباشرة`);
  wrap.append(bar);
  if(guestState.waiting || !guestState.revealed){
    wrap.append(el("div",{class:"tb-guest-wait"},"⏳ بانتظار المضيفة تسحب أول بطاقة..."));
  } else {
    const {type, card} = guestState.revealed;
    const isQ = type==="q";
    const cardWrap = el("div",{style:"display:flex;align-items:center;justify-content:center;padding:20px;"});
    const cardEl = el("div",{class:"tb-card"+(isQ?"":" is-c")});
    cardEl.append(el("div",{class:"tb-badge"}, isQ?"سؤال":"تحدّي"));
      cardEl.append(el("div",{class:"tb-diamond right"}), el("div",{class:"tb-diamond left"}));
    cardEl.append(el("div",{class:"tb-proverb"}, '"'+card.proverb+'"'));
    cardEl.append(el("div",{class:"tb-body-text"}, card.text));
    cardEl.append(el("div",{},el("span",{class:"tb-pill"}, isQ?"السؤال":"التحدّي")));
    cardWrap.append(cardEl);
    wrap.append(cardWrap);
  }
  return wrap;
}

function watermarkLayer(){
  const layer = el("div",{class:"watermark-layer"});
  const label = `مرخّص للاستخدام الشخصي فقط لـ: ${current.username} | ${current.email}`;
  for(let row=0; row<6; row++){
    for(let col=0; col<3; col++){
      const tile = el("div",{class:"watermark-tile",style:`top:${row*90+ (col%2?15:0)}px; left:${col*260 - 60}px;`}, label);
      layer.append(tile);
    }
  }
  return layer;
}

/* ============== منع النسخ / القص / أدوات المطور (على مستوى المتصفح فقط) ============== */
document.addEventListener("contextmenu", (e)=>{
  if(view==="viewer") e.preventDefault();
});
document.addEventListener("selectstart", (e)=>{
  if(view==="viewer") e.preventDefault();
});
document.addEventListener("copy", (e)=>{
  if(view==="viewer") e.preventDefault();
});
document.addEventListener("keydown", (e)=>{
  if(view!=="viewer") return;
  const k = e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && ["c","s","p","u"].includes(k)) e.preventDefault();
  if(e.key === "PrintScreen"){
    navigator.clipboard && navigator.clipboard.writeText("").catch(()=>{});
  }
});
document.addEventListener("visibilitychange", ()=>{
  const guard = document.getElementById("blurGuard");
  if(view==="viewer" && document.hidden){ guard.style.display="flex"; }
  else { guard.style.display="none"; }
});
</script>
