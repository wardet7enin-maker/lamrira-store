<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الملفات الرقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1420;
    --surface:#161F32;
    --surface-2:#1E2A44;
    --line:#2A3552;
    --accent:#E7B24B;
    --accent-ink:#3A2A05;
    --teal:#35B6A6;
    --danger:#E1665F;
    --text:#F2EFE7;
    --text-dim:#93A0BF;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  /* ===== top bar ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;}
  .brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:900;color:#0E1420;}
  .topbar-actions{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text-dim);}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--text-dim);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}

  /* ===== centered auth card ===== */
  .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px;width:100%;max-width:400px;}
  .card h2{margin:0 0 6px;font-size:22px;font-weight:900;}
  .card p.sub{margin:0 0 22px;color:var(--text-dim);font-size:14px;}
  label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;margin-top:14px;}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:14px;}
  input:focus{outline:none;border-color:var(--accent);}
  .form-actions{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .switch-link{text-align:center;font-size:13px;color:var(--text-dim);margin-top:16px;}
  .switch-link a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:700;}
  .error-msg{background:rgba(225,101,95,.12);border:1px solid rgba(225,101,95,.4);color:#ffb4af;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:14px;}
  .info-msg{background:rgba(53,182,166,.12);border:1px solid rgba(53,182,166,.4);color:#a9e9e0;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:14px;}

  /* ===== catalog ===== */
  .page{padding:28px;max-width:1100px;margin:0 auto;width:100%;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:24px;margin:0 0 4px;font-weight:900;}
  .page-head p{color:var(--text-dim);margin:0;font-size:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .product-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s ease;position:relative;}
  .product-card:hover{border-color:var(--accent);}
  .product-thumb{height:110px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:12px;}
  .product-card h3{margin:0 0 6px;font-size:16px;}
  .product-card p{margin:0;color:var(--text-dim);font-size:13px;line-height:1.5;min-height:38px;}
  .badge{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;}
  .badge-locked{background:rgba(225,101,95,.15);color:#ffb4af;}
  .badge-unlocked{background:rgba(53,182,166,.15);color:#a9e9e0;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}

  /* ===== modal ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(4,6,12,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;max-width:380px;width:100%;text-align:center;}
  .modal .icon{width:52px;height:52px;border-radius:50%;background:rgba(225,101,95,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;}
  .modal h3{margin:0 0 8px;font-size:17px;}
  .modal p{margin:0 0 20px;color:var(--text-dim);font-size:14px;line-height:1.6;}

  /* ===== viewer / protected content ===== */
  .viewer-wrap{position:relative;flex:1;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-moz-user-select:none;}
  .viewer-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);}
  .viewer-body{flex:1;position:relative;padding:36px;overflow:auto;background:
    radial-gradient(circle at 20% 20%, rgba(231,178,75,.05), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(53,182,166,.05), transparent 40%),
    var(--bg);}
  .content-box{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:34px;position:relative;}
  .content-box h2{margin-top:0;}
  .content-box p{line-height:1.9;color:#dfe3ee;}
  .watermark-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
  .watermark-tile{position:absolute;white-space:nowrap;font-size:13px;font-weight:700;color:rgba(255,255,255,.09);transform:rotate(-28deg);}
  .protection-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);padding:10px 24px;border-top:1px solid var(--line);background:var(--surface);}
  .blur-guard{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim);text-align:center;padding:20px;}

  /* ===== admin ===== */
  .tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .tab{padding:10px 4px;margin-left:20px;font-size:14px;font-weight:700;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--accent);border-color:var(--accent);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:right;color:var(--text-dim);font-size:12px;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);}
  td{padding:12px;border-bottom:1px solid var(--line);}
  tr:hover td{background:rgba(255,255,255,.02);}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
  .panel h3{margin:0 0 16px;font-size:16px;}
  .inline-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .inline-form .full{grid-column:1/-1;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .chip-on{background:rgba(53,182,166,.15);color:#a9e9e0;}
  .chip-off{background:rgba(255,255,255,.06);color:var(--text-dim);}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .small-note{font-size:12px;color:var(--text-dim);margin-top:8px;}
  /* ===== تصميم "تبريعة وامردة" — نفس ألوان وتصميم البطاقات الأصلية ===== */
  .tb-screen{--tb-bg:#F3E5C8;--tb-card:#FBF3E1;--tb-orange:#C0652E;--tb-navy:#1E3A5F;--tb-qbox:#E7EEF6;--tb-cbox:#F5E8D5;--tb-gold:#D9A441;
    position:relative;min-height:100%;background:var(--tb-bg);color:var(--tb-navy);overflow:hidden;display:flex;flex-direction:column;}
  .tb-blob{position:absolute;bottom:-10%;left:-10%;width:70%;height:45%;background:radial-gradient(circle at 30% 30%, #D89B6B, #C0652E 70%);border-radius:50%;opacity:.5;filter:blur(2px);pointer-events:none;}
  .tb-blob2{position:absolute;bottom:-18%;right:-15%;width:55%;height:38%;background:radial-gradient(circle at 60% 40%, #E7C089, #C77A3F 70%);border-radius:50%;opacity:.6;pointer-events:none;}
  .tb-inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;}
  .tb-dots{display:flex;gap:6px;justify-content:center;margin:10px 0;}
  .tb-dot{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);}
  .tb-title{font-size:34px;font-weight:900;color:var(--tb-navy);margin:10px 0;}
  .tb-tagline{font-size:16px;font-weight:700;color:var(--tb-orange);margin-bottom:6px;}
  .tb-quote-box{border:2px solid var(--tb-gold);background:var(--tb-card);border-radius:14px;padding:14px 22px;margin:18px 0;font-weight:700;color:var(--tb-navy);max-width:420px;}
  .tb-eyebrow{font-size:13px;color:var(--tb-navy);opacity:.75;font-weight:700;}
  .tb-btn{border:none;border-radius:30px;padding:14px 32px;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;background:var(--tb-orange);color:#fff;margin-top:10px;}
  .tb-btn.navy{background:var(--tb-navy);}
  .tb-credit{position:absolute;bottom:14px;right:20px;left:20px;display:flex;justify-content:space-between;font-size:10px;color:var(--tb-navy);opacity:.55;z-index:2;}
  .tb-intro-box{border:2px solid var(--tb-gold);background:var(--tb-card);border-radius:16px;padding:22px;max-width:520px;text-align:right;line-height:2;font-size:14px;}
  .tb-intro-box .em{color:var(--tb-orange);font-weight:800;}
  .tb-choice-row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

  /* شاشة سحب البطاقات */
  .tb-game{flex:1;display:flex;flex-direction:row;position:relative;z-index:2;}
  .tb-pile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:20px;position:relative;}
  .tb-pile.q{border-left:2px dashed rgba(30,58,95,.25);}
  .tb-stack{position:relative;width:120px;height:150px;}
  .tb-stack .layer{position:absolute;inset:0;border-radius:14px;border:2px solid rgba(255,255,255,.5);}
  .tb-pile.q .layer{background:linear-gradient(135deg,var(--tb-orange),#9c4c20);}
  .tb-pile.c .layer{background:linear-gradient(135deg,var(--tb-navy),#0f2137);}
  .tb-stack .layer:nth-child(1){transform:rotate(-6deg) translateY(4px);}
  .tb-stack .layer:nth-child(2){transform:rotate(4deg) translateY(2px);}
  .tb-stack .layer:nth-child(3){display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;}
  .tb-pile-label{font-weight:900;font-size:17px;}
  .tb-pile.q .tb-pile-label{color:var(--tb-orange);}
  .tb-pile.c .tb-pile-label{color:var(--tb-navy);}
  .tb-pile-hint{font-size:12px;color:var(--tb-navy);opacity:.6;}
  .tb-pile-count{font-size:11px;color:var(--tb-navy);opacity:.5;}

  /* البطاقة المكشوفة */
  .tb-reveal-overlay{position:absolute;inset:0;z-index:5;background:var(--tb-bg);display:flex;align-items:center;justify-content:center;padding:22px;}
  .tb-card{position:relative;background:var(--tb-card);border-radius:22px;border-top:4px solid var(--tb-orange);max-width:480px;width:100%;padding:46px 26px 26px;text-align:center;}
  .tb-card.is-c{border-top-color:var(--tb-navy);}
  .tb-badge{position:absolute;top:-34px;right:50%;transform:translateX(50%);width:78px;height:78px;border-radius:50%;background:var(--tb-orange);border:4px solid var(--tb-card);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:19px;}
  .tb-card.is-c .tb-badge{background:var(--tb-navy);}
  .tb-num{position:absolute;top:8px;left:18px;font-weight:900;font-size:20px;color:var(--tb-orange);}
  .tb-card.is-c .tb-num{color:var(--tb-navy);}
  .tb-diamond{position:absolute;top:14px;width:9px;height:9px;background:var(--tb-gold);transform:rotate(45deg);}
  .tb-diamond.right{right:16px;}
  .tb-diamond.left{left:16px;}
  .tb-proverb{background:var(--tb-qbox);border-radius:12px;padding:18px 16px;margin:18px 0 10px;font-weight:800;font-style:italic;color:var(--tb-navy);font-size:17px;line-height:1.7;}
  .tb-card.is-c .tb-proverb{background:var(--tb-cbox);color:var(--tb-orange);}
  .tb-body-text{font-size:15px;line-height:1.9;color:#3a2f22;margin:14px 4px 6px;}
  .tb-pill{display:inline-block;border:none;border-radius:22px;padding:9px 26px;font-weight:900;font-size:13px;color:#fff;background:var(--tb-orange);margin-top:16px;}
  .tb-card.is-c .tb-pill{background:var(--tb-navy);}
  .tb-reveal-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

  .tb-exit{position:absolute;top:14px;left:14px;z-index:6;width:34px;height:34px;border-radius:50%;border:none;background:rgba(30,58,95,.12);color:var(--tb-navy);font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .tb-exit:hover{background:rgba(30,58,95,.22);}

  .mini-cover{height:110px;border-radius:8px;overflow:hidden;position:relative;background:#F3E5C8;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:12px;}
  .mini-cover .mc-blob{position:absolute;bottom:-20%;left:-10%;width:60%;height:55%;background:radial-gradient(circle at 30% 30%,#D89B6B,#C0652E 70%);border-radius:50%;opacity:.55;}
  .mini-cover .mc-blob2{position:absolute;bottom:-25%;right:-10%;width:45%;height:42%;background:radial-gradient(circle at 60% 40%,#E7C089,#C77A3F 70%);border-radius:50%;opacity:.6;}
  .mini-cover .mc-title{position:relative;z-index:2;font-weight:900;color:#1E3A5F;font-size:16px;}
  .mini-cover .mc-tag{position:relative;z-index:2;color:#C0652E;font-size:10px;font-weight:700;margin-top:3px;}

  @media (max-width:640px){
    .inline-form{grid-template-columns:1fr;}
    .page{padding:18px;}
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px;}
    td{border:none;padding:6px 8px;}
    td::before{content:attr(data-label);display:block;font-size:11px;color:var(--text-dim);margin-bottom:2px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="blur-guard" id="blurGuard">
  ⚠️ تم إخفاء المحتوى مؤقتًا لحماية الملف — ارجع إلى نافذة العرض لمتابعة القراءة
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============== إعداد الاتصال بـ Supabase ============== */
const SUPABASE_URL = "https://qahzbdfblehhmzrhbiaq.supabase.co";
const SUPABASE_KEY = "sb_publishable_2otk9YG8zhJ_4y-EFr_v7A_35CuWEPg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_EMAIL = "wardet7enin@gmail.com";
const HEARTBEAT_MS = 15000;
const SESSION_TIMEOUT_MS = 40000;
const MAX_DEVICES = 3;

let current = null;      // {email, username, isAdmin}
let products = [];
let approvedIds = new Set();
let mySessionId = null;
let heartbeatTimer = null;
let view = "loading";
let viewParams = {};
let recoveryMode = false; // true عند العودة من رابط "نسيت كلمة المرور"

/* ============== أدوات مساعدة عامة ============== */
function fmtErr(error){
  if(!error) return "حدث خطأ غير متوقع.";
  const msg = (error.message||"").toLowerCase();
  if(msg.includes("invalid login")) return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  if(msg.includes("already registered") || msg.includes("already exists")) return "هذا البريد الإلكتروني مسجل مسبقًا.";
  if(msg.includes("password") && msg.includes("least")) return "كلمة المرور قصيرة جدًا (6 أحرف على الأقل).";
  if(msg.includes("email not confirmed")) return "لم يتم تأكيد بريدك الإلكتروني بعد. تحققي من صندوق الوارد.";
  return error.message || "حدث خطأ غير متوقع.";
}

/* ============== الجلسات وحد الأجهزة ============== */
async function activeSessionCount(email){
  const cutoff = new Date(Date.now()-SESSION_TIMEOUT_MS).toISOString();
  const { count, error } = await sb.from("device_sessions")
    .select("id", { count: "exact", head: true })
    .eq("user_email", email)
    .gt("last_seen", cutoff);
  if(error){ console.warn(error); return 0; }
  return count||0;
}
async function startHeartbeat(email){
  mySessionId = crypto.randomUUID();
  await sb.from("device_sessions").insert({ user_email: email, session_id: mySessionId, last_seen: new Date().toISOString() });
  heartbeatTimer = setInterval(async ()=>{
    await sb.from("device_sessions").update({ last_seen: new Date().toISOString() }).eq("session_id", mySessionId);
  }, HEARTBEAT_MS);
}
function stopHeartbeat(){
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = null;
}
async function endMySession(){
  if(mySessionId){ await sb.from("device_sessions").delete().eq("session_id", mySessionId); }
  stopHeartbeat();
  mySessionId = null;
}

/* ============== تحميل البيانات ============== */
async function loadProducts(){
  const { data, error } = await sb.from("products").select("*").order("created_at", {ascending:true});
  products = error ? [] : (data||[]);
}
async function loadMyApprovals(email){
  const { data, error } = await sb.from("approvals").select("product_id").eq("user_email", email);
  approvedIds = new Set(error ? [] : (data||[]).map(r=>r.product_id));
}
function isApproved(productId){
  return approvedIds.has(productId);
}

/* ============== المصادقة ============== */
async function establishSession(session){
  const email = session.user.email;
  const username = (session.user.user_metadata && session.user.user_metadata.username) || email.split("@")[0];
  current = { email, username, isAdmin: email.toLowerCase()===ADMIN_EMAIL };
  await loadProducts();
  await loadMyApprovals(email);
  await startHeartbeat(email);
}
async function logout(){
  await endMySession();
  await sb.auth.signOut();
  current = null;
  view = "login";
  render();
}

/* ============== الأدوات المساعدة للواجهة ============== */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(view==="loading") app.append(el("div",{class:"center-wrap"}, el("p",{},"جارِ التحميل...")));
  else if(view==="login") app.append(renderLogin());
  else if(view==="register") app.append(renderRegister());
  else if(view==="check-email") app.append(renderCheckEmail());
  else if(view==="reset-password") app.append(renderResetPassword());
  else if(view==="catalog") app.append(renderCatalog());
  else if(view==="viewer") app.append(renderViewer());
  else if(view==="admin") app.append(renderAdmin());
}

/* ============== شاشة الدخول ============== */
function renderLogin(){
  const wrap = el("div",{class:"center-wrap"});
  const card = el("div",{class:"card"});
  card.append(el("h2",{},"تسجيل الدخول"));
  card.append(el("p",{class:"sub"},"ادخل إلى حسابك لعرض المنتجات المسموح لك بالوصول إليها."));
  const email = el("input",{type:"email",placeholder:"you@example.com"});
  const pass = el("input",{type:"password",placeholder:"••••••••"});
  const errBox = el("div",{});
  card.append(el("label",{},"البريد الإلكتروني"), email);
  card.append(el("label",{},"كلمة المرور"), pass);
  card.append(errBox);
  const actions = el("div",{class:"form-actions"});
  const submitBtn = el("button",{class:"btn btn-primary"},"دخول");
  submitBtn.addEventListener("click", async ()=>{
    errBox.innerHTML="";
    const emailVal = email.value.trim().toLowerCase();
    const passVal = pass.value;
    if(!emailVal || !passVal){ errBox.append(el("div",{class:"error-msg"},"الرجاء إدخال البريد الإلكتروني وكلمة المرور.")); return; }
    submitBtn.disabled=true; submitBtn.textContent="جارِ التحقق...";
    const { data, error } = await sb.auth.signInWithPassword({ email: emailVal, password: passVal });
    if(error){
      submitBtn.disabled=false; submitBtn.textContent="دخول";
      errBox.append(el("div",{class:"error-msg"}, fmtErr(error)));
      return;
    }
    const activeCount = await activeSessionCount(emailVal);
    if(activeCount >= MAX_DEVICES){
      await sb.auth.signOut();
      submitBtn.disabled=false; submitBtn.textContent="دخول";

/* ============== شاشة تعيين كلمة مرور جديدة (من رابط الاستعادة) ============== */
function renderResetPassword(){
  const wrap = el("div",{class:"center-wrap"});
  const card = el("div",{class:"card"});
  card.append(el("h2",{},"تعيين كلمة مرور جديدة"));

  const errBox = el("div",{});
  card.append(el("label",{},"كلمة المرور الجديدة"), pass);
  card.append(el("label",{},"تأكيد كلمة المرور"), pass2);
  card.append(errBox);
  const submitBtn = el("button",{class:"btn btn-primary"},"حفظ كلمة المرور");
  submitBtn.addEventListener("click", async ()=>{

    if(pass.value.length<6){ errBox.append(el("div",{class:"error-msg"},"كلمة المرور يجب ألا تقل عن 6 أحرف.")); return; }
    if(pass.value!==pass2.value){ errBox.append(el("div",{class:"error-msg"},"كلمتا المرور غير متطابقتين.")); return; }
    submitBtn.disabled=true; submitBtn.textContent="جارِ الحفظ...";

    submitBtn.disabled=false; submitBtn.textContent="حفظ كلمة المرور";
    if(error){ errBox.append(el("div",{class:"error-msg"}, fmtErr(error))); return; }
    recoveryMode = false;
    await sb.auth.signOut();
    current = null;
    errBox.append(el("div",{class:"info-msg"},"تم الحفظ بنجاح! سجّلي الدخول بكلمة المرور الجديدة."));

/* ============== الشريط العلوي المشترك ============== */
function topbar(activeIsAdmin){

    right.append(el("button",{class:"btn btn-ghost btn-sm",onclick:()=>{view="admin";render();}},"لوحة المالك"));
  }
  if(activeIsAdmin){
    right.append(el("button",{class:"btn btn-ghost btn-sm",onclick:()=>{view="catalog";render();}},"عرض المتجر"));
  }
  right.append(el("button",{class:"btn btn-danger btn-sm",onclick:logout},"تسجيل الخروج"));

    errBox.innerHTML="";

    if(pass.value!==pass2.value){ errBox.append(el("div",{class:"error-msg"},"غير متطابقتين.")); return; }
    saveBtn.disabled=true; saveBtn.textContent="جارِ الحفظ...";

/* ============== لوحة المالك (Admin) ============== */
let adminTab = "products";
let allApprovals = [];
let allSessions = [];

function renderAdmin(){
  const wrap = el("div",{});
  wrap.append(topbar(true));
  const page = el("div",{class:"page"});
  page.append(el("div",{class:"page-head"}, el("h1",{},"لوحة المالك"), el("p",{},"إدارة المنتجات، صلاحيات الوصول، والأجهزة المتصلة.")));

  const tabs = el("div",{class:"tabs"});
  [["products","المنتجات"],["access","صلاحيات الوصول"],["sessions","الأجهزة النشطة"]].forEach(([key,label])=>{
    const t = el("div",{class:"tab"+(adminTab===key?" active":"")}, label);
    t.addEventListener("click", async ()=>{ adminTab=key; await refreshAdminTabData(); render(); });
    tabs.append(t);
  });
  page.append(tabs);

  if(adminTab==="products") page.append(renderAdminProducts());
  if(adminTab==="access") page.append(renderAdminAccess());
  if(adminTab==="sessions") page.append(renderAdminSessions());

  wrap.append(page);
  return wrap;
}
async function refreshAdminTabData(){
  if(adminTab==="access"){
    const { data } = await sb.from("approvals").select("*").order("created_at",{ascending:false});
    allApprovals = data||[];
  }
  if(adminTab==="sessions"){
    const { data } = await sb.from("device_sessions").select("*");
    allSessions = data||[];
  }
}

function renderAdminSessions(){
  const box = el("div",{});
  const panel = el("div",{class:"panel"});
  panel.append(el("h3",{},`الأجهزة النشطة (الحد الأقصى ${MAX_DEVICES} لكل مستخدمة)`));
  const cutoff = Date.now()-SESSION_TIMEOUT_MS;
  const byEmail = {};
  allSessions.forEach(s=>{
    const t = new Date(s.last_seen).getTime();
    if(t < cutoff) return;
    byEmail[s.user_email] = (byEmail[s.user_email]||0)+1;
  });
  const emails = Object.keys(byEmail);
  if(emails.length===0){
    panel.append(el("p",{class:"small-note"},"لا توجد جلسات نشطة حاليًا."));
  } else {
    const table = el("table");
    table.append(el("thead",{},el("tr",{}, el("th",{},"البريد الإلكتروني"), el("th",{},"عدد الأجهزة النشطة"), el("th",{},"إجراءات"))));
    const tbody = el("tbody");
    emails.forEach(email=>{
      const tr = el("tr",{});
      tr.append(el("td",{"data-label":"البريد"},email));
      tr.append(el("td",{"data-label":"العدد"}, `${byEmail[email]} / ${MAX_DEVICES}`));
      const actions = el("td",{"data-label":"إجراءات"});
      const clearBtn = el("button",{class:"btn btn-ghost btn-sm"},"تسجيل خروج من كل الأجهزة");
      clearBtn.addEventListener("click", async ()=>{
        clearBtn.disabled=true;
        await sb.from("device_sessions").delete().eq("user_email", email);
        await refreshAdminTabData();
        render();
      });
      actions.append(clearBtn);
      tr.append(actions);
      tbody.append(tr);
    });
    table.append(tbody);
    panel.append(table);
  }
  box.append(panel);
  return box;
}

sb.auth.onAuthStateChange((event, session)=>{
  if(event === "PASSWORD_RECOVERY"){
    recoveryMode = true;
    view = "reset-password";
    render();
  }
});

(async function init(){
  try{
    if(window.location.hash.includes("type=recovery")){
      // سنعالجها عبر onAuthStateChange أعلاه
      return;
    }
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      await establishSession(session);
      view = current.isAdmin ? "admin" : "catalog";
    } else {
      view = "login";
    }
    render();
  }catch(err){
    document.getElementById("app").innerHTML =
      '<div style="padding:40px;text-align:center;color:#F2EFE7;font-family:Tajawal,sans-serif;">'
      + '<h2>حدث خطأ أثناء تحميل الصفحة</h2>'
      + '<p style="color:#93A0BF;">' + (err && err.message ? err.message : String(err)) + '</p>'
      + '</div>';
    console.error(err);

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{ if(c!=null) e.append(c instanceof Node ? c : document.createTextNode(c)); });
  return e;
}
function tebraaExitBtn(){
  const btn = el("button",{class:"tb-exit",onclick:()=>{tebraaState=null; view="catalog"; render();}},"✕");
  return btn;
}

/* ============== لعبة "تبريعة وامردة" ============== */
function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
let tebraaState = null;
function initTebraaState(){
  tebraaState = {
    screen: "cover", // cover | intro | game
    qQueue: shuffledIndices(TEBRAA_QUESTIONS.length), qPos: 0,
    cQueue: shuffledIndices(TEBRAA_CHALLENGES.length), cPos: 0,
    revealed: null, // {type:'q'|'c', card}
  };
}
function tebraaNextCard(type){
  const isQ = type==="q";
  const list = isQ ? TEBRAA_QUESTIONS : TEBRAA_CHALLENGES;
  let queueKey = isQ ? "qQueue" : "cQueue", posKey = isQ ? "qPos" : "cPos";
  if(tebraaState[posKey] >= tebraaState[queueKey].length){
    tebraaState[queueKey] = shuffledIndices(list.length);
    tebraaState[posKey] = 0;
  }
  const idx = tebraaState[queueKey][tebraaState[posKey]];
  tebraaState[posKey]++;
  return list[idx];
}
function renderTebraaGame(){
  if(!tebraaState) initTebraaState();
  if(tebraaState.screen==="cover") return tebraaCoverScreen();
  if(tebraaState.screen==="intro") return tebraaIntroScreen();
  return tebraaGameScreen();
}

  inner.append(dotsRow(["gold","navy","orange"]));

  inner.append(el("div",{class:"tb-quote-box"},"«  تاري دلّالي •• ليلة من ذوك الليالي  »"));
  const startBtn = el("button",{class:"tb-btn",onclick:()=>{tebraaState.screen="intro";render();}},"ابدأوا اللعبة");
  inner.append(startBtn);
  s.append(inner);
  s.append(watermarkLayer());
  s.append(el("div",{class:"tb-credit"}, el("span",{},"فكرة وتصميم : لَـمْريــرة"), el("span",{},"يمنع إعادة البيع أو التوزيع أو النسخ دون إذن")));
  return s;
}

  const row = el("div",{class:"tb-choice-row"});

  box.append(row);

function dotsRow(colors){
  const wrap = el("div",{class:"tb-dots"});
  colors.forEach(c=>wrap.append(diamondDot(c)));
  return wrap;
}
function diamondDot(color){
  const map = {gold:"var(--tb-gold)", navy:"var(--tb-navy)", orange:"var(--tb-orange)"};
  return el("span",{class:"tb-dot",style:`background:${map[color]||color};`});
}
function tebraaGameScreen(){
  const s = el("div",{class:"tb-screen",style:"flex:1;"});
  s.append(tebraaExitBtn());
  const game = el("div",{class:"tb-game"});

  const qPile = el("div",{class:"tb-pile q"});
  qPile.append(el("div",{class:"tb-stack"},
    el("div",{class:"layer"}), el("div",{class:"layer"}), el("div",{class:"layer"},"سؤال")));
  qPile.append(el("div",{class:"tb-pile-label"},"بطاقة سؤال"));
  qPile.append(el("div",{class:"tb-pile-hint"},"اضغطي لسحب سؤال"));
  qPile.addEventListener("click", ()=>{ tebraaState.revealed={type:"q", card:tebraaNextCard("q")}; render(); });

  const cPile = el("div",{class:"tb-pile c"});
  cPile.append(el("div",{class:"tb-stack"},
    el("div",{class:"layer"}), el("div",{class:"layer"}), el("div",{class:"layer"},"تحدّي")));
  cPile.append(el("div",{class:"tb-pile-label"},"بطاقة تحدّي"));
  cPile.append(el("div",{class:"tb-pile-hint"},"اضغطي لسحب تحدّي"));
  cPile.addEventListener("click", ()=>{ tebraaState.revealed={type:"c", card:tebraaNextCard("c")}; render(); });

  game.append(qPile, cPile);
  s.append(game);
  s.append(watermarkLayer());

  if(tebraaState.revealed){
    s.append(tebraaRevealOverlay());
  }
  return s;
}
function tebraaRevealOverlay(){
  const {type, card} = tebraaState.revealed;
  const isQ = type==="q";
  const overlay = el("div",{class:"tb-reveal-overlay"});
  const cardEl = el("div",{class:"tb-card"+(isQ?"":" is-c")});
  cardEl.append(el("div",{class:"tb-badge"}, isQ?"سؤال":"تحدّي"));
  cardEl.append(el("div",{class:"tb-num"}, card.n));
  cardEl.append(el("div",{class:"tb-diamond right"}), el("div",{class:"tb-diamond left"}));
  cardEl.append(el("div",{class:"tb-proverb"}, '"'+card.proverb+'"'));
  cardEl.append(el("div",{class:"tb-body-text"}, card.text));
  cardEl.append(el("div",{},el("span",{class:"tb-pill"}, isQ?"السؤال":"التحدّي")));
  const actions = el("div",{class:"tb-reveal-actions"});
  const backBtn = el("button",{class:"tb-btn"+(isQ?"":" navy")}, "رجوع للكومتين");
  backBtn.addEventListener("click", ()=>{ tebraaState.revealed=null; render(); });
  actions.append(backBtn);
  cardEl.append(actions);
  overlay.append(cardEl);
  return overlay;
}
function watermarkLayer(){
  const layer = el("div",{class:"watermark-layer"});
  const label = `مرخّص للاستخدام الشخصي فقط لـ: ${current.username} | ${current.email}`;
  for(let row=0; row<6; row++){
    for(let col=0; col<3; col++){
      const tile = el("div",{class:"watermark-tile",style:`top:${row*90+ (col%2?15:0)}px; left:${col*260 - 60}px;`}, label);
      layer.append(tile);
    }
  }
  return layer;
}

/* ============== منع النسخ / القص / أدوات المطور (على مستوى المتصفح فقط) ============== */
document.addEventListener("contextmenu", (e)=>{
  if(view==="viewer") e.preventDefault();
});
document.addEventListener("selectstart", (e)=>{
  if(view==="viewer") e.preventDefault();
});
document.addEventListener("copy", (e)=>{
  if(view==="viewer") e.preventDefault();
});
document.addEventListener("keydown", (e)=>{
  if(view!=="viewer") return;
  const k = e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && ["c","s","p","u"].includes(k)) e.preventDefault();
  if(e.key === "PrintScreen"){
    navigator.clipboard && navigator.clipboard.writeText("").catch(()=>{});
  }
});
document.addEventListener("visibilitychange", ()=>{
  const guard = document.getElementById("blurGuard");
  if(view==="viewer" && document.hidden){ guard.style.display="flex"; }
  else { guard.style.display="none"; }
});
